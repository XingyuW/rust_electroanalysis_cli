uncertainty = 0.0
source = "default reduced-order model"
validity_domain = "must be calibrated for the experimental domain"

[[model.parameters]]
id = "slow_gain"
unit = "dimensionless"
lower_bound = -10.0
upper_bound = 10.0
default_value = 0.2
uncertainty = 0.0
source = "default reduced-order model"
validity_domain = "must be calibrated for the experimental domain"

[[model.parameters]]
id = "baseline_drift_v_per_s"
unit = "V/s"
