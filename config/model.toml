default_value = 1.0
uncertainty = 0.0
source = "default reduced-order model"
validity_domain = "must be calibrated for the experimental domain"

[[model.parameters]]
id = "fast_gain"
unit = "dimensionless"
lower_bound = -10.0
upper_bound = 10.0
default_value = 1.0
uncertainty = 0.0
source = "default reduced-order model"
validity_domain = "must be calibrated for the experimental domain"

[[model.parameters]]
