[package]
name = "rust_electroanalysis_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
# Reviewed provider revision. Keep this as an exact Git commit so a clean
# consumer checkout never resolves against a mutable sibling working tree.
electrodata-io = { git = "https://github.com/XingyuW/electrodata-io.git", rev = "dbb6b7d063972114c4208980723e12c807ab199e" }
clap = { version = "4", features = ["derive"] }
csv = "1"
plotters = "0.3"
image = "0.25.10"
levenberg-marquardt = "0.15.0"
nalgebra = "0.34.2"
nom = "8"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2.0"
sha2 = "0.10"
thiserror = "2"
toml = "1.1.2"
genevo = "0.7.1"
rayon = "1.12.0"
rand = "0.8"
rustfft = "6"

[profile.release]
opt-level      = 3
panic          = "abort"
codegen-units  = 1
lto            = "fat"
strip = "symbols"
debug = false
